extends: jpeg640_plain_nonunit_focus_3ep.yaml
paths:
  run_name: jpeg640_pair_branch_control_3ep
train:
  finetune_from: jpeg640_plain_nonunit_focus_3ep/ckpt/best.pt
  finetune_weights: ema
  resume: true
  jpeg_pair_training: true
  jpeg_consistency_weight: 0.0
  jpeg_teacher_min_dice: 0.8
  jpeg_teacher_threshold: 0.47265625
  jpeg_pair_quality_min: 80
  jpeg_pair_quality_max: 95
  epochs: 3
  epoch_size: 28720
  batch_size: 8
  accum_steps: 2
  workers: 4
  devices: [0]
  fmap_lr: 0.00003
  warmup_frac: 0.0
loss:
  # Frozen decoder stays in eval mode; supervise main segmentation/classification.
  aux_loss_weight: 0.0
augmentation:
  # JPEGPairDataset uses unchanged full frames, with paired recompression only.
  jpeg_recompression_probability: 0.0
  full_frame_probability: 1.0
  final_full_frame_epochs: 3
