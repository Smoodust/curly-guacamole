extends: jpeg576_fusion_local_bn_aux_weighted_val.yaml
paths:
  run_name: jpeg576_fusion_local_bn_aux_weighted_val_focal_boundary
train:
  # Match the completed local BN run snapshot, not machine defaults.
  batch_size: 16
  accum_steps: 1
# Same training recipe and pretrained initialization as local BN; no fine-tune.
# Keep BatchNorm and model.aux_weight=0.4 inherited from the parent.
loss:
  pixel_loss: focal
  focal_gamma: 1.0
  dice_scope: all
  dice_weight: 1.0
  dice_area_reference: 0.05
  dice_area_max_weight: 3.0
  boundary_weight: 1.0
  # Preserve existing auxiliary BCE + Dice implementation and weight.
  # Area weighting also applies to auxiliary Dice through the shared loss code.
